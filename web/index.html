<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangman</title>
<style>
  :root{
    --ink: #0d1117;
    --ink-2: #141b24;
    --line: #2a3542;
    --brass: #c9973d;
    --brass-dim: #8a6a2e;
    --paper: #e9e4d8;
    --paper-dim: #9aa4ad;
    --danger: #b5482e;
    --success: #4f9b6e;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% -10%, #1b2530 0%, transparent 55%),
      radial-gradient(circle at 90% 110%, #1a1310 0%, transparent 45%),
      var(--ink);
    color: var(--paper);
    font-family: 'Georgia', 'Times New Roman', serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }

  .frame{
    width:100%;
    max-width: 720px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, var(--ink-2), var(--ink));
    padding: 36px 40px 40px;
    position:relative;
  }

  .frame::before{
    content:"";
    position:absolute;
    inset: 10px;
    border: 1px solid rgba(201,151,61,0.25);
    pointer-events:none;
  }

  header{
    text-align:center;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
  }

  h1{
    margin:0;
    font-size: 2.1rem;
    letter-spacing: 0.06em;
    font-weight: 400;
    color: var(--brass);
  }

  .subtitle{
    margin-top:8px;
    color: var(--paper-dim);
    font-size: 0.92rem;
    font-style: italic;
  }

  .stage{
    display:flex;
    gap: 32px;
    align-items:center;
    justify-content:center;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  #gallows{
    flex-shrink:0;
  }

  #gallows line, #gallows path, #gallows circle{
    stroke: var(--paper);
    stroke-width: 3;
    fill:none;
    stroke-linecap: round;
  }

  #gallows .rope-part{
    stroke: var(--danger);
  }

  .status-panel{
    min-width: 220px;
  }

  .tries{
    font-size: 0.95rem;
    color: var(--paper-dim);
    margin-bottom: 6px;
  }

  .tries strong{
    color: var(--brass);
  }

  .wrong-letters{
    min-height: 26px;
    letter-spacing: 0.15em;
    color: var(--danger);
    font-size: 1rem;
  }

  .word-display{
    text-align:center;
    font-size: 2.3rem;
    letter-spacing: 0.35em;
    margin: 10px 0 30px;
    color: var(--paper);
    word-break: break-all;
  }

  .word-display span.blank{
    color: var(--brass-dim);
  }

  .keyboard{
    display:grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 8px;
    margin-bottom: 26px;
  }

  .key{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--paper);
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 0;
    cursor:pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .key:hover:not(:disabled){
    border-color: var(--brass);
    color: var(--brass);
  }

  .key:disabled{
    cursor: default;
    opacity: 0.35;
  }

  .key.correct{
    border-color: var(--success);
    color: var(--success);
    opacity: 1;
  }

  .key.wrong{
    border-color: var(--danger);
    color: var(--danger);
    opacity: 1;
  }

  .message{
    text-align:center;
    min-height: 30px;
    font-size: 1.15rem;
    margin-bottom: 20px;
  }

  .message.win{ color: var(--success); }
  .message.lose{ color: var(--danger); }

  .controls{
    display:flex;
    justify-content:center;
  }

  #restart{
    background: transparent;
    border: 1px solid var(--brass);
    color: var(--brass);
    font-family: inherit;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    padding: 12px 28px;
    cursor:pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  #restart:hover{
    background: var(--brass);
    color: var(--ink);
  }

  footer{
    margin-top: 26px;
    text-align:center;
    font-size: 0.78rem;
    color: var(--paper-dim);
    letter-spacing: 0.05em;
  }

  @media (max-width: 480px){
    .frame{ padding: 24px 18px 28px; }
    h1{ font-size: 1.6rem; }
    .word-display{ font-size: 1.6rem; letter-spacing: 0.2em; }
    .keyboard{ grid-template-columns: repeat(6, 1fr); }
    .stage{ gap: 18px; }
    #gallows{ width: 140px; height: 160px; }
  }
</style>
</head>
<body>

<div class="frame">
  <header>
    <h1>HANGMAN</h1>
    <div class="subtitle">Guess the word before the rope runs out</div>
  </header>

  <div class="stage">
    <svg id="gallows" width="160" height="180" viewBox="0 0 160 180">
      <!-- gallows structure -->
      <line x1="10" y1="170" x2="110" y2="170" />
      <line x1="35" y1="170" x2="35" y2="15" />
      <line x1="35" y1="15" x2="105" y2="15" />
      <line x1="105" y1="15" x2="105" y2="35" />
      <!-- rope parts, toggled visible via JS -->
      <circle id="part-head" class="rope-part" cx="105" cy="52" r="17" style="display:none" />
      <line id="part-body" class="rope-part" x1="105" y1="69" x2="105" y2="115" style="display:none" />
      <line id="part-arm-l" class="rope-part" x1="105" y1="85" x2="85" y2="100" style="display:none" />
      <line id="part-arm-r" class="rope-part" x1="105" y1="85" x2="125" y2="100" style="display:none" />
      <line id="part-leg-l" class="rope-part" x1="105" y1="115" x2="88" y2="145" style="display:none" />
      <line id="part-leg-r" class="rope-part" x1="105" y1="115" x2="122" y2="145" style="display:none" />
    </svg>

    <div class="status-panel">
      <div class="tries">Attempts left: <strong id="triesLeft">6</strong></div>
      <div class="wrong-letters" id="wrongLetters"></div>
    </div>
  </div>

  <div class="word-display" id="wordDisplay"></div>

  <div class="message" id="message"></div>

  <div class="keyboard" id="keyboard"></div>

  <div class="controls">
    <button id="restart">PLAY AGAIN</button>
  </div>

  <footer>Made by Muhammad Saad &middot; Hangman</footer>
</div>

<script>
  const WORDS = [
    "python", "hangman", "computer", "keyboard", "science", "world",
    "programming", "algorithm", "function", "variable", "loop", "condition",
    "string", "integer", "boolean", "list", "dictionary", "tuple", "set",
    "exception", "module", "package", "library", "framework", "object",
    "class", "method", "inheritance", "polymorphism", "encapsulation",
    "abstraction", "Claude", "AI", "machine", "learning", "data", "analysis",
    "visualization", "statistics", "probability", "regression",
    "classification", "clustering", "neural", "network", "deep",
    "reinforcement", "natural", "language", "processing", "ChatGPT",
    "Gemini", "Bing", "Google", "OpenAI", "Microsoft", "Apple", "Amazon",
    "Facebook", "Twitter", "Instagram", "Snapchat", "TikTok", "YouTube",
    "Reddit", "LinkedIn", "Pinterest", "WhatsApp", "Telegram", "Signal",
    "Discord", "Slack", "Saad", "Muhammad", "Asad", "Ali", "Hassan",
    "Ahmed", "Khan", "Nawaz", "Rashid", "Farooq", "Javed", "Saeed",
    "Zahid", "Imran", "Shahid", "Faisal", "Bilal", "Usman", "Ahsan",
    "Tariq", "Waseem", "Jarrar", "Hifza",
  ];
  const MAX_TRIES = 6;
  const bodyParts = ["part-head", "part-body", "part-arm-l", "part-arm-r", "part-leg-l", "part-leg-r"];

  let word = "";
  let guessed = [];
  let wrongCount = 0;

  const wordDisplay = document.getElementById("wordDisplay");
  const keyboard = document.getElementById("keyboard");
  const triesLeft = document.getElementById("triesLeft");
  const wrongLettersEl = document.getElementById("wrongLetters");
  const message = document.getElementById("message");
  const restartBtn = document.getElementById("restart");

  function startGame(){
    word = WORDS[Math.floor(Math.random() * WORDS.length)].toLowerCase();
    guessed = [];
    wrongCount = 0;
    message.textContent = "";
    message.className = "message";

    bodyParts.forEach(id => {
      document.getElementById(id).style.display = "none";
    });

    triesLeft.textContent = MAX_TRIES;
    wrongLettersEl.textContent = "";

    renderWord();
    renderKeyboard();
  }

  function renderWord(){
    wordDisplay.innerHTML = word.split("").map(letter => {
      if(guessed.includes(letter)){
        return `<span>${letter.toUpperCase()}</span>`;
      }
      return `<span class="blank">_</span>`;
    }).join(" ");
  }

  function renderKeyboard(){
    keyboard.innerHTML = "";
    "abcdefghijklmnopqrstuvwxyz".split("").forEach(letter => {
      const btn = document.createElement("button");
      btn.className = "key";
      btn.textContent = letter.toUpperCase();
      btn.addEventListener("click", () => handleGuess(letter, btn));
      keyboard.appendChild(btn);
    });
  }

  function handleGuess(letter, btn){
    if(guessed.includes(letter)) return;
    guessed.push(letter);
    btn.disabled = true;

    if(word.includes(letter)){
      btn.classList.add("correct");
    } else {
      btn.classList.add("wrong");
      wrongCount++;
      document.getElementById(bodyParts[wrongCount - 1]).style.display = "block";
      triesLeft.textContent = MAX_TRIES - wrongCount;
      const wrongSoFar = guessed.filter(l => !word.includes(l));
      wrongLettersEl.textContent = wrongSoFar.map(l => l.toUpperCase()).join(" ");
    }

    renderWord();
    checkGameOver();
  }

  function checkGameOver(){
    const won = word.split("").every(l => guessed.includes(l));
    const lost = wrongCount >= MAX_TRIES;

    if(won){
      message.textContent = "You guessed it — the word was " + word.toUpperCase();
      message.className = "message win";
      disableKeyboard();
    } else if(lost){
      wordDisplay.innerHTML = word.split("").map(l => `<span>${l.toUpperCase()}</span>`).join(" ");
      message.textContent = "Game over. The word was " + word.toUpperCase();
      message.className = "message lose";
      disableKeyboard();
    }
  }

  function disableKeyboard(){
    document.querySelectorAll(".key").forEach(btn => btn.disabled = true);
  }

  restartBtn.addEventListener("click", startGame);

  document.addEventListener("keydown", (e) => {
    const letter = e.key.toLowerCase();
    if(letter.length === 1 && letter >= "a" && letter <= "z"){
      const btn = [...keyboard.children].find(b => b.textContent === letter.toUpperCase());
      if(btn && !btn.disabled) handleGuess(letter, btn);
    }
  });

  startGame();
</script>

</body>
</html>
